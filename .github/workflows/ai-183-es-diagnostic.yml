name: AI183 ES inverse translator diagnostic

on:
  push:
    branches: [editorial/ai-certify-183-20261115]
    paths: [.github/workflows/ai-183-es-diagnostic.yml]

permissions:
  contents: read

jobs:
  reverse-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install inverse neural translator
        run: python -m pip install argostranslate==1.11.0
      - name: Probe es-to-en before changing editorial data
        run: |
          python - <<'PY'
          import argostranslate.package as package
          import argostranslate.translate as translate
          package.update_package_index()
          fwd=next(x for x in package.get_available_packages() if x.from_code=='en' and x.to_code=='es')
          package.install_from_path(fwd.download())
          print('installed forward en_es model', fwd.package_version)
          src=next(x for x in package.get_available_packages() if x.from_code=='es' and x.to_code=='en')
          print('selected version',src.package_version)
          package.install_from_path(src.download())
          ls=translate.get_installed_languages()
          reverse=next(x for x in ls if x.code=='es').get_translation(next(x for x in ls if x.code=='en'))
          forward=next(x for x in ls if x.code=='en').get_translation(next(x for x in ls if x.code=='es'))
          english="Celebrate Arabic's diverse linguistic and cultural heritage and promote language access, learning and mutual understanding across communities."
          generated=forward.translate(english)
          print('MODEL_FORWARD:',repr(generated))
          print('MODEL_REVERSE:',repr(reverse.translate(generated)))
          samples=[
              'La UNESCO ha celebrado el Día Mundial de la Lengua Árabe el 18 de diciembre desde 2012.',
              'La ONU agregó árabe como su sexto idioma oficial el 18 de diciembre de 1973.',
              'Celebrar el patrimonio lingüístico y cultural de la lengua árabe.',
              'Celebrar el diverso patrimonio lingüístico y cultural del árabe y promover el acceso al idioma, el aprendizaje y la comprensión mutua entre las comunidades.',
          ]
          for s in samples:
              print('SOURCE:',repr(s))
              print('REVERSE:',repr(reverse.translate(s)))
          PY
