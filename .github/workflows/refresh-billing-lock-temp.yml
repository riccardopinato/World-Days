name: Temporary billing lock refresh

on:
  push:
    branches: [phase-e-store-billing-adapter]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit generated lock when changed
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "Refresh lockfile for store billing"
          git push origin HEAD:phase-e-store-billing-adapter
