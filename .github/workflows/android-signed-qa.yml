name: Signed Android QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-days-signed-android-qa
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_CERT_SHA256: B46CA3081B6B512FF94F310B0CCE2714B443E465A21F4847C4016272DF80BDD3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require stable signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Build and validate dataset
        run: |
          python3 tool/build_dataset.py
          python3 tool/validate_dataset.py
          python3 tool/build_editorial.py
          python3 tool/validate_editorial.py
          python3 tool/build_editorial_locales.py
          python3 tool/validate_editorial_locales.py
          python3 tool/validate_discovery.py
          python3 tool/validate_localizations.py

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Generate platform scaffold
        run: ./tool/bootstrap_platforms.sh

      - name: Install stable signing identity
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/world-days-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 tool/configure_android_signing.py

      - name: Validate generated native configuration
        run: |
          python3 tool/validate_native_retention.py
          python3 tool/validate_native_monetization.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify committed dependency lock
        run: git diff --exit-code -- pubspec.lock

      - name: Generate launcher icons
        run: dart run launcher_icons

      - name: Validate branding
        run: python3 tool/validate_branding.py

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed Android artifacts
        run: |
          flutter build apk --release --split-per-abi --tree-shake-icons --build-number "$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --tree-shake-icons --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify signing certificate
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          CERT_OUTPUT="$RUNNER_TEMP/apksigner-cert-output.txt"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$CERT_OUTPUT"

          ACTUAL="$(
            grep -Ei 'certificate SHA-256 digest:' "$CERT_OUTPUT" |
              head -n 1 |
              grep -Eo '[0-9A-Fa-f]{64}' |
              tr '[:lower:]' '[:upper:]'
          )"

          if [[ -z "$ACTUAL" ]]; then
            echo "Unable to extract APK signing certificate SHA-256 from apksigner output" >&2
            exit 1
          fi

          echo "APK signer SHA-256: $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "Signing certificate mismatch: expected $EXPECTED_CERT_SHA256, got $ACTUAL" >&2
            exit 1
          fi

          printf 'certificateSha256=%s\nsourceSha=%s\nrunId=%s\nversionCode=%s\n' \
            "$ACTUAL" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" \
            > build/signing-evidence.txt
          sha256sum "$APK" build/app/outputs/bundle/release/app-release.aab \
            > build/artifact-sha256.txt

      - name: Upload signed QA artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-days-signed-android-qa
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/signing-evidence.txt
            build/artifact-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/world-days-release.jks"
