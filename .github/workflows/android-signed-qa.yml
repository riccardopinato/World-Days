name: Signed Android QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-days-signed-android-qa
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_CERT_SHA256: B46CA3081B6B512FF94F310B0CCE2714B443E465A21F4847C4016272DF80BDD3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve source version identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION_SPEC="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          if [[ ! "$VERSION_SPEC" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$ ]]; then
            echo "::error::pubspec version must be MAJOR.MINOR.PATCH+positiveBuildNumber; got $VERSION_SPEC"
            exit 1
          fi
          echo "WORLD_DAYS_VERSION_NAME=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "WORLD_DAYS_VERSION_CODE=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - name: Require stable signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Build and validate dataset
        run: |
          python3 tool/build_dataset.py
          python3 tool/validate_dataset.py
          python3 tool/build_editorial.py
          python3 tool/validate_editorial.py
          python3 tool/build_editorial_locales.py
          python3 tool/validate_editorial_locales.py
          python3 tool/build_content_pack.py
          python3 tool/validate_content_pack.py
          python3 tool/validate_discovery.py
          python3 tool/validate_localizations.py
          python3 tool/validate_release_governance.py
          python3 tool/test_release_evidence.py

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Generate platform scaffold
        run: ./tool/bootstrap_platforms.sh

      - name: Install stable signing identity
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/world-days-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 tool/configure_android_signing.py

      - name: Validate generated native configuration
        run: |
          python3 tool/validate_native_retention.py
          python3 tool/validate_native_monetization.py
          python3 tool/validate_native_content_pack.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify committed dependency lock
        run: git diff --exit-code -- pubspec.lock

      - name: Generate launcher icons
        run: dart run launcher_icons

      - name: Validate branding
        run: python3 tool/validate_branding.py

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed Android artifacts
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --tree-shake-icons \
            --build-name "$WORLD_DAYS_VERSION_NAME" \
            --build-number "$WORLD_DAYS_VERSION_CODE"
          flutter build appbundle \
            --release \
            --tree-shake-icons \
            --build-name "$WORLD_DAYS_VERSION_NAME" \
            --build-number "$WORLD_DAYS_VERSION_CODE"

      - name: Verify signing certificate
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          CERT_OUTPUT="$RUNNER_TEMP/apksigner-cert-output.txt"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$CERT_OUTPUT"

          ACTUAL="$(
            grep -Ei 'certificate SHA-256 digest:' "$CERT_OUTPUT" |
              head -n 1 |
              grep -Eo '[0-9A-Fa-f]{64}' |
              tr '[:lower:]' '[:upper:]'
          )"

          if [[ -z "$ACTUAL" ]]; then
            echo "Unable to extract APK signing certificate SHA-256 from apksigner output" >&2
            exit 1
          fi

          echo "APK signer SHA-256: $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "Signing certificate mismatch: expected $EXPECTED_CERT_SHA256, got $ACTUAL" >&2
            exit 1
          fi

          AAB="build/app/outputs/bundle/release/app-release.aab"
          printf 'certificateSha256=%s\nsourceSha=%s\nrunId=%s\nversionName=%s\nversionCode=%s\n' \
            "$ACTUAL" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$WORLD_DAYS_VERSION_NAME" "$WORLD_DAYS_VERSION_CODE" \
            > build/signing-evidence.txt
          sha256sum "$APK" "$AAB" > build/artifact-sha256.txt
          python3 tool/write_android_artifact_manifest.py \
            --output build/signed-qa-artifact-manifest.json \
            --lane signed-qa \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --version-name "$WORLD_DAYS_VERSION_NAME" \
            --version-code "$WORLD_DAYS_VERSION_CODE" \
            --certificate-sha256 "$ACTUAL" \
            --apk "$APK" \
            --aab "$AAB"

      - name: Upload signed QA artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-signed-android-qa
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/signing-evidence.txt
            build/artifact-sha256.txt
            build/signed-qa-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/world-days-release.jks"
