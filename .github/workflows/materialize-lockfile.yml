name: Materialize dependency lockfile

on:
  push:
    branches: [lockfile-baseline]
    paths:
      - ".github/workflows/materialize-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lockfile-baseline

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit lockfile and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock
          rm -f .github/workflows/materialize-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock .github/workflows/materialize-lockfile.yml
          git commit -m "chore: pin Flutter dependency lockfile"
          git push origin HEAD:lockfile-baseline
