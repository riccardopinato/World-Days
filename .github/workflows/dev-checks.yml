name: Development checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-days-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate dataset
        run: |
          python3 tool/market_wave04.py
          python3 tool/market_wave06.py
          python3 tool/market_wave07.py
          python3 tool/market_wave08.py
          python3 tool/market_wave09.py
          python3 tool/market_wave10.py
          python3 tool/market_wave11.py
          python3 tool/market_wave12.py
          python3 tool/market_wave13.py
          python3 tool/build_dataset.py
          python3 tool/validate_dataset.py
          python3 tool/validate_wave06_generated.py
          python3 tool/validate_wave07_generated.py
          python3 tool/validate_wave08_generated.py
          python3 tool/validate_wave09_generated.py
          python3 tool/validate_wave10_generated.py
          python3 tool/validate_wave11_generated.py
          python3 tool/validate_wave12_generated.py
          python3 tool/validate_wave13_generated.py
          python3 tool/test_discover_eures_institutional.py
          python3 tool/validate_eures_research_batch.py
          python3 tool/triage_bulk_institutional.py
          python3 tool/validate_institutional_wave05.py
          python3 tool/validate_wave11_bulk_research.py
          python3 tool/validate_wave11_wikidata_300.py
          python3 tool/triage_wave11_wikidata_300.py
          python3 tool/reconcile_wave11_goal_1111.py
          python3 tool/probe_wikidata_recurring_days.py
          python3 tool/build_editorial.py
          python3 tool/editorial_1111_source_audit_queue.py
          python3 tool/validate_editorial_1111_source_audit.py
          python3 tool/editorial_research_handoff.py
          python3 tool/editorial_origin_wave100.py
          python3 tool/validate_editorial_origin_wave100.py
          python3 tool/editorial_origin_completion_waves.py
          python3 tool/validate_editorial_origin_completion_waves.py
          python3 tool/validate_editorial_research_handoff.py
          python3 tool/validate_173_editorial_review_queue.py
          python3 tool/export_origin_block100_20261113.py
          python3 tool/test_editorial_origin_completion_partial.py
          python3 tool/build_origin_review_index.py
          python3 tool/validate_origin_review_index.py
          python3 tool/validate_origin_runtime_approval_gate.py
          python3 tool/validate_editorial_origin_wave14_20261112.py
          python3 tool/validate_editorial_origin_wave15_20261112.py
          python3 tool/validate_editorial_origin_wave16_20261112.py
          python3 tool/validate_editorial_origin_wave17_20261112.py
          python3 tool/validate_editorial_origin_wave18_20261112.py
          python3 tool/validate_editorial_origin_wave19_20261112.py
          python3 tool/validate_editorial_origin_wave20_20261113.py
          python3 tool/validate_editorial_origin_wave01_20261112.py
          python3 tool/validate_editorial_origin_wave02_20261112.py
          python3 tool/validate_editorial_origin_wave03_20261112.py
          python3 tool/validate_editorial_origin_wave04_20261112.py
          python3 tool/validate_editorial_origin_wave05_20261112.py
          python3 tool/validate_origin_100_original_drafts_20261112.py
          python3 tool/validate_editorial_batch.py
          python3 tool/validate_editorial_wave03.py
          python3 tool/validate_country_editorial_candidates.py
          python3 tool/validate_country_wave02_editorial.py
          python3 tool/validate_editorial_candidates_25_locales.py
          python3 tool/market_coverage.py
          python3 tool/validate_editorial.py
          python3 tool/build_editorial_locales.py
          python3 tool/validate_editorial_locales.py
          python3 tool/build_content_pack.py
          python3 tool/validate_content_pack.py
          python3 tool/validate_discovery.py
          python3 tool/validate_localizations.py
          python3 tool/validate_release_governance.py
          python3 tool/test_release_evidence.py
          python3 tool/test_ruleset_guard.py
          python3 tool/test_saved_profile_report.py

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Generate platform scaffold
        run: ./tool/bootstrap_platforms.sh

      - name: Validate native scaffold
        run: |
          python3 tool/validate_native_retention.py
          python3 tool/validate_native_monetization.py
          python3 tool/validate_native_content_pack.py

      - name: Resolve dependencies and verify committed lockfile
        run: flutter pub get

      - name: Verify committed dependency lock
        run: git diff --exit-code -- pubspec.lock

      - name: Generate launcher icons
        run: dart run launcher_icons

      - name: Validate branding
        run: python3 tool/validate_branding.py

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test civil dates in Europe/Rome timezone
        env:
          TZ: Europe/Rome
        run: |
          flutter test test/domain/local_civil_day_test.dart test/core/retention_engine_test.dart

      - name: Build Web release
        run: flutter build web --release --base-href "/World-Days/"

      - name: Archive full origin-research evidence and pending-story coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-origin-review-1111-plus
          path: reports/origin_review_coverage.json
          if-no-files-found: error
          retention-days: 20

      - name: Archive source-bound catalog coverage and draft gates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-catalog-coverage
          path: reports/market_coverage.json
          if-no-files-found: error
          retention-days: 20

      - name: Archive 25 six-locale candidate review matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-editorial-candidates-25
          path: reports/editorial_candidates_25_parity.json
          if-no-files-found: error
          retention-days: 20

      - name: Archive source evidence and story research gaps across all days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-editorial-source-audit-1111-plus
          path: reports/editorial_1111_source_audit_queue.json
          if-no-files-found: error
          retention-days: 20

      - name: Archive first 100 source-linked historical story research dossiers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-first-100-origin-dossiers
          path: reports/editorial_origin_wave100.json
          if-no-files-found: error
          retention-days: 20

      - name: Archive all remaining origin-story 100-ID research waves
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-all-origin-waves-100
          path: reports/editorial_origin_completion/
          if-no-files-found: error
          retention-days: 20

      - name: Build Android ARM64 gate
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --release --split-per-abi --tree-shake-icons

      - name: Upload Android ARM64 APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-android-arm64-internal
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
