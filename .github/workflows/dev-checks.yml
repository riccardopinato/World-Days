name: Development checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-days-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate dataset
        run: |
          python3 tool/build_dataset.py
          python3 tool/validate_dataset.py
          python3 tool/build_editorial.py
          python3 tool/validate_editorial.py
          python3 tool/build_editorial_locales.py
          python3 tool/validate_editorial_locales.py
          python3 tool/validate_discovery.py
          python3 tool/validate_localizations.py

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Generate platform scaffold
        run: ./tool/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web release
        run: flutter build web --release --base-href "/World-Days/"

      - name: Build Android ARM64 gate
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --split-per-abi --tree-shake-icons
