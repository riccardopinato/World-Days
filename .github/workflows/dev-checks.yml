name: Development checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-days-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate dataset
        run: |
          python3 tool/build_dataset.py
          python3 tool/validate_dataset.py
          python3 tool/build_editorial.py
          python3 tool/validate_editorial.py
          python3 tool/build_editorial_locales.py
          python3 tool/validate_editorial_locales.py
          python3 tool/validate_discovery.py
          python3 tool/validate_localizations.py

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Generate platform scaffold
        run: ./tool/bootstrap_platforms.sh

      - name: Validate native scaffold
        run: |
          python3 tool/validate_native_retention.py
          python3 tool/validate_native_monetization.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit resolved dependency lock
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already stable"
            exit 0
          fi
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/pubspec.lock?ref=${HEAD_REF}" --jq .sha)"
          CONTENT="$(base64 -w0 pubspec.lock)"
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/pubspec.lock" \
            -f message="chore: lock Step 10 dependencies" \
            -f content="$CONTENT" \
            -f sha="$CURRENT_SHA" \
            -f branch="$HEAD_REF" >/dev/null

      - name: Verify committed dependency lock
        run: git diff --exit-code -- pubspec.lock

      - name: Generate launcher icons
        run: dart run launcher_icons

      - name: Validate branding
        run: python3 tool/validate_branding.py

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web release
        run: flutter build web --release --base-href "/World-Days/"

      - name: Build Android ARM64 gate
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --split-per-abi --tree-shake-icons

      - name: Upload Android ARM64 APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-days-android-arm64-internal
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
