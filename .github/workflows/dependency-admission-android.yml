name: Dependency admission Android

on:
  pull_request:
    branches: [main]
    paths:
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/dependency-admission-android.yml

permissions:
  contents: read

concurrency:
  group: world-days-dependency-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Preflight strict lock before scaffold
        run: |
          test -s pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Generate canonical bundled content
        run: |
          python3 tool/build_dataset.py
          python3 tool/build_editorial.py
          python3 tool/build_editorial_locales.py
          python3 tool/build_content_pack.py

      - name: Bootstrap native platforms
        run: ./tool/bootstrap_platforms.sh

      - name: Verify scaffold did not mutate lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Strict dependency lock and immutable tree
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Generate launcher icons and localization
        run: |
          dart run launcher_icons
          flutter gen-l10n

      - name: Build non-production-signed release-mode ARM64 APK
        run: flutter build apk --release --split-per-abi --tree-shake-icons

      - name: Record artifact identity (not production signing)
        run: |
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          printf 'source_sha=%s\n' "$GITHUB_SHA"
          sha256sum build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          wc -c build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload non-production Android compile evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-dependency-admission-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
