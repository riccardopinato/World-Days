name: Materialize Step 7 lockfile

on:
  push:
    branches: [step-7-lockfile-materialize]
    paths:
      - ".github/workflows/materialize-step7-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: step-7-lockfile-materialize

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit lockfile and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock
          rm -f .github/workflows/materialize-step7-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock .github/workflows/materialize-step7-lockfile.yml
          git commit -m "chore: refresh Step 7 dependency lockfile"
          git push origin HEAD:step-7-lockfile-materialize
