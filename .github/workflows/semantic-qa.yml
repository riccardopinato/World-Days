name: Semantic QA — World Days published stories x 6 languages

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/editorial/published/**'
      - 'tool/semantic_qa_adapter.py'
      - 'tool/test_semantic_qa_adapter.py'
      - 'tool/semantic_qa_zero_cost_historicity.py'
      - 'tool/test_semantic_qa_zero_cost_historicity.py'
      - '.github/workflows/semantic-qa.yml'
  push:
    branches: [main]
    paths:
      - 'data/editorial/published/**'
      - 'tool/semantic_qa_adapter.py'
      - 'tool/test_semantic_qa_adapter.py'
      - 'tool/semantic_qa_zero_cost_historicity.py'
      - 'tool/test_semantic_qa_zero_cost_historicity.py'
      - '.github/workflows/semantic-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-semantic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate World Days semantic source adapter
        run: |
          python3 tool/test_semantic_qa_adapter.py
          python3 tool/test_semantic_qa_zero_cost_historicity.py
      - name: Download exact pinned central engine
        env:
          CORE_SHA: 827a271dcbd8f1608afabb60ca07184b20926991
        run: |
          mkdir -p build/semantic_qa
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/riccardopinato/App-Factory-Core/$CORE_SHA/reference_engines/semantic_qa/semantic_qa.py" \
            -o build/semantic_qa/semantic_qa.py
          python3 -m py_compile build/semantic_qa/semantic_qa.py
      - name: Restore only same-ref incremental semantic cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .semantic-qa-cache/world.json
          key: semantic-world-v1-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            semantic-world-v1-${{ github.ref_name }}-
      - name: Normalize all published story dossiers without changing content
        run: python3 tool/semantic_qa_adapter.py --output build/semantic_qa/input.json
      - name: Free offline structural audit (no API credentials or provider)
        run: |
          set -euo pipefail
          python3 build/semantic_qa/semantic_qa.py \
            --input build/semantic_qa/input.json \
            --report build/semantic_qa/report.json \
            --cache .semantic-qa-cache/world.json \
            --workers 4 --batch-size 100 --provider offline
          count=$(python3 -c 'import json; print(len(json.load(open("build/semantic_qa/input.json"))["records"]))')
          python3 tool/semantic_qa_adapter.py --verify-report build/semantic_qa/report.json --expected-count "$count"
          echo "Offline report is advisory, not semantic certification."
      - name: Detect year and provenance deltas with zero AI API calls
        run: python3 tool/semantic_qa_zero_cost_historicity.py --output build/semantic_qa/zero_cost_historicity.json
      - name: Upload original scope and review findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-days-semantic-qa
          path: |
            build/semantic_qa/input.json
            build/semantic_qa/report.json
            build/semantic_qa/zero_cost_historicity.json
          if-no-files-found: ignore
          retention-days: 14
