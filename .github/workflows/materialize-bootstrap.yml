name: Materialize World Days foundation

on:
  push:
    branches: [bootstrap-foundation]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/materialize-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bootstrap-foundation

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunks/chunk_* > /tmp/worlddays_project.tar.gz.b64
          echo "acd327b70c461e0d42985fc8ea4fcb968ad50e1a8533bd3ac0ef7cf3ffa9ab0c  /tmp/worlddays_project.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/worlddays_project.tar.gz.b64 > /tmp/worlddays_project.tar.gz
          echo "6fdc614eb658f8a258a0965c9a4706288e5fe670f373e261c6c2ccb48b85f5d2  /tmp/worlddays_project.tar.gz" | sha256sum -c -
          tar -xzf /tmp/worlddays_project.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit materialized foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes."
            exit 0
          fi
          git commit -m "feat: materialize World Days Flutter foundation"
          git push origin HEAD:bootstrap-foundation
