name: Materialize World Days foundation

on:
  push:
    branches: [bootstrap-foundation]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/materialize-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bootstrap-foundation

      - name: Materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/worlddays_project.tar.gz.b64 > /tmp/worlddays_project.tar.gz
          tar -xzf /tmp/worlddays_project.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit materialized foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes."
            exit 0
          fi
          git commit -m "feat: materialize World Days Flutter foundation"
          git push origin HEAD:bootstrap-foundation
