name: FAST02 — Civic Source Admission Gate
on:
  push:
    branches: [content/fast02-civic-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify 12 new fixed civic research metadata records
        run: python3 tool/validate_fast02_civic_source.py
      - name: Rebuild and validate unchanged 492-record app baseline
        run: |
          python3 tool/build_dataset.py
          python3 tool/validate_dataset.py
      - name: Confirm new source records do NOT silently enter runtime
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/research/FAST02_CIVIC_12_SOURCE_STAGED_20261110.json'))
          c=json.load(open('assets/data/official_core.json'))
          existing={x['id'] for x in c['records']}
          assert len(existing)==len(c['records'])==492
          assert all(x['id'] not in existing for x in d['records'])
          print('SOURCE ONLY PASS: 12 staged, 492 in source application runtime, six markets require admission')
          PY
