name: Refresh discovery source snapshots

on:
  push:
    branches: [step-4-dataset-consumer-expansion]
    paths:
      - "tool/snapshot_discovery_sources.py"
      - "tool/build_discovery.py"
      - "tool/validate_discovery.py"
      - ".github/workflows/refresh-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-days-discovery-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: step-4-dataset-consumer-expansion

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install snapshot dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2

      - name: Build official oracle
        run: python tool/build_dataset.py

      - name: Snapshot discovery sources
        run: python tool/snapshot_discovery_sources.py

      - name: Build discovery backlog
        run: python tool/build_discovery.py

      - name: Validate discovery backlog
        run: python tool/validate_discovery.py

      - name: Commit generated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery docs/DISCOVERY_DATA_REPORT.md
          if git diff --cached --quiet; then
            echo "No discovery snapshot changes."
            exit 0
          fi
          git commit -m "data: refresh consumer discovery snapshots"
          git push origin HEAD:step-4-dataset-consumer-expansion
