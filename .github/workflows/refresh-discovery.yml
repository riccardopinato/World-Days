name: Refresh discovery source snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-days-discovery-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install snapshot dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2

      - name: Build official oracle
        run: python tool/build_dataset.py

      - name: Snapshot discovery sources
        run: python tool/snapshot_discovery_sources.py

      - name: Build discovery backlog
        run: python tool/build_discovery.py

      - name: Validate discovery backlog
        run: python tool/validate_discovery.py

      - name: Upload refresh proposal
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: discovery-refresh-${{ github.run_id }}
          path: |
            data/discovery
            docs/DISCOVERY_DATA_REPORT.md
          if-no-files-found: error
          retention-days: 14
