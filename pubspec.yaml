name: world_days
description: Discover what the world observes today.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  share_plus: 12.0.2
  flutter_local_notifications: 22.3.1
  flutter_timezone: 5.1.0
  timezone: 0.11.1
  home_widget: 0.10.0
  google_mobile_ads: 9.1.0
  in_app_purchase: 3.3.1
  http: 1.6.0
  path_provider: 2.1.6
  cryptography: 2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  launcher_icons: 0.16.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/official_core.json
    - assets/data/occurrences_2026.json
    - assets/data/editorial_en.json
    - assets/data/editorial_it.json
    - assets/data/editorial_es.json
    - assets/data/editorial_fr.json
    - assets/data/editorial_de.json
    - assets/data/editorial_pt.json
